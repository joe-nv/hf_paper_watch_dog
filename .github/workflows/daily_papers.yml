name: Fetch Daily Papers

on:
  schedule:
    # runs at 08:00 UTC daily (HF daily papers are typically available by then)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to fetch (YYYY-MM-DD). Leave empty for today.'
        required: false
        type: string
      backfill:
        description: 'Number of days to backfill (from the date above or today)'
        required: false
        type: number
        default: 0
      rebuild_book:
        description: 'Force rebuild summaries and chronicle textbook PDF even if no new papers'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-papers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch papers
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          DATE_ARG=""
          BACKFILL_ARG=""
          if [ -n "$INPUT_DATE" ]; then
            if echo "$INPUT_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              DATE_ARG="$INPUT_DATE"
            else
              echo "ERROR: invalid date format '$INPUT_DATE', expected YYYY-MM-DD"
              exit 1
            fi
          fi
          if [ -n "$INPUT_BACKFILL" ] && [ "$INPUT_BACKFILL" != "0" ]; then
            if echo "$INPUT_BACKFILL" | grep -qE '^[0-9]+$'; then
              BACKFILL_ARG="--backfill $INPUT_BACKFILL"
            else
              echo "ERROR: invalid backfill value '$INPUT_BACKFILL', expected integer"
              exit 1
            fi
          fi
          python scripts/fetch_papers.py $DATE_ARG $BACKFILL_ARG

      - name: Update per-paper summaries and compile Chronicle textbook PDF
        env:
          FORCE_REBUILD: ${{ github.event.inputs.rebuild_book }}
          ENABLE_CHRONICLE_BUILD: ${{ vars.ENABLE_CHRONICLE_BUILD }}
        run: |
          if [ "$ENABLE_CHRONICLE_BUILD" = "false" ] && [ "$FORCE_REBUILD" != "true" ]; then
            echo "Chronicle build disabled via ENABLE_CHRONICLE_BUILD=false; skipping."
            exit 0
          fi
          if [ -n "$(git status --porcelain papers/)" ] || [ "$FORCE_REBUILD" = "true" ]; then
            python scripts/summarize_papers.py --skip-existing
            if [ "$FORCE_REBUILD" = "true" ]; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends fonts-noto-cjk
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              python scripts/build_chronicle.py
            else
              (
                sudo apt-get update &&
                sudo apt-get install -y --no-install-recommends fonts-noto-cjk &&
                python -m pip install --upgrade pip &&
                pip install -r requirements.txt &&
                python scripts/build_chronicle.py
              ) || echo "::warning::Chronicle PDF rebuild failed; committing new papers and summaries safely."
            fi
          else
            echo "No new papers fetched; skipping summary and textbook PDF rebuild."
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers/ summaries/ chronicle/
          if git diff --cached --quiet; then
            echo "No new papers to commit."
          else
            DATE_DISPLAY="${{ github.event.inputs.date }}"
            if [ -z "$DATE_DISPLAY" ]; then
              DATE_DISPLAY="$(date -u +%Y-%m-%d)"
            fi
            git commit -m "papers: add daily papers and update chronicle for ${DATE_DISPLAY}"
            git push
          fi
